[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flyto-blueprint"
version = "0.3.0"
description = "Self-evolving workflow pattern engine for Flyto2"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "ai-workflow-automation",
    "workflow-blueprints",
    "agentic-automation",
    "workflow-patterns",
    "yaml-recipes",
    "flyto2",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.4.0",
]

[project.scripts]
flyto-blueprint-benchmark = "flyto_blueprint.benchmark:main"

[project.optional-dependencies]
# 2.29.0 is the first Core release that clears every published advisory. The
# number is not a constant to keep in step by hand: flyto-ai's
# tests/test_stack_security_floor.py derives it from flyto-core's own
# security/advisories.json and checks this file too, because flyto-ai's CI is the
# only place in the stack with all three checkouts present. It moved from 2.28.1
# when Core published five more advisories, one of them critical, against
# <= 2.28.1.
core = ["flyto-core>=2.29.0"]
# Floors, like every other dependency here: an unbounded name resolves to
# whatever exists, including a yanked or pre-1.0 line.
firestore = ["google-cloud-firestore>=2.19.0,<3", "firebase-admin>=6.5.0,<8"]
dev = ["pytest>=9.0.3", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://flyto2.com"
Documentation = "https://docs.flyto2.com"
Repository = "https://github.com/flytohub/flyto-blueprint"
Issues = "https://github.com/flytohub/flyto-blueprint/issues"
Changelog = "https://github.com/flytohub/flyto-blueprint/blob/main/CHANGELOG.md"
Security = "https://github.com/flytohub/flyto-blueprint/blob/main/SECURITY.md"
Blog = "https://blog.flyto2.com/posts/ai-workflow-automation-alternatives"
Examples = "https://docs.flyto2.com/blueprint/"

[tool.hatch.build.targets.wheel]
packages = ["flyto_blueprint"]
