name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, build, verify
    runs-on: ubuntu-latest
    steps:
      # `fetch-tags` because the release-drift check compares HEAD against the
      # tag the declared version names. Without tag history it cannot separate
      # "this version is unreleased" from "this version already shipped other
      # code", and it fails loudly rather than reporting an unearned pass.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build "ruff==0.15.15" "flyto-indexer @ git+https://github.com/flytohub/flyto-indexer@1b624987b15ef7cd2361370478d07ea36e5aa5ee"

      - name: Check release drift
        run: python scripts/check_release_drift.py

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Benchmark v1 evidence integrity
        run: >-
          python scripts/benchmark-scorecard.py verify-results
          --suite benchmarks/suites/blueprint-effectiveness-v1.yaml
          --results-dir benchmarks/results

      - name: Benchmark v2 evidence integrity
        run: >-
          python scripts/benchmark-scorecard.py verify-results
          --suite benchmarks/suites/blueprint-effectiveness-v2.yaml
          --results-dir benchmarks/results/blueprint-effectiveness-v2

      - name: Benchmark v3 evidence closure
        run: >-
          python scripts/benchmark-scorecard.py verify-results
          --suite benchmarks/suites/blueprint-effectiveness-v3.yaml
          --results-dir benchmarks/results/blueprint-effectiveness-v3

      - name: Longitudinal learning evidence integrity
        run: |
          for evidence in benchmarks/results/longitudinal/*.evidence.json; do
            python scripts/run_longitudinal_evidence.py verify \
              --evidence "${evidence}"
          done

      - name: Build package
        run: python -m build

      - name: Verify repository
        run: flyto-index verify . --full-scan --strict --json
