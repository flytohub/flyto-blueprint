name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, build, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build "ruff==0.15.15" "flyto-indexer @ git+https://github.com/flytohub/flyto-indexer@1b624987b15ef7cd2361370478d07ea36e5aa5ee"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Benchmark evidence integrity
        run: >-
          python scripts/benchmark-scorecard.py verify-results
          --suite benchmarks/suites/blueprint-effectiveness-v1.yaml
          --results-dir benchmarks/results

      - name: Build package
        run: python -m build

      - name: Verify repository
        run: flyto-index verify . --full-scan --strict --json
