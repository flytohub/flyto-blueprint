version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Routine version-update PRs are intentionally disabled. Repository
    # Dependabot security updates remain enabled and are handled separately.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Keep SHA-pinned GitHub Actions current - Dependabot bumps the pin and
  # updates the trailing version comment, so pinning does not mean rotting.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep security updates, but do not create weekly version-bump branches.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
      - "ci"
