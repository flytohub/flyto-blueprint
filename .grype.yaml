# This action is pinned to patched release 1.14.2. Syft records GitHub Actions
# by commit SHA, so Grype cannot compare it with the advisory's semver range.
# Keep the exception exact: advisory + package + type + patched SHA.
ignore:
  - vulnerability: GHSA-vxmw-7h4f-hqxh
    package:
      name: pypa/gh-action-pypi-publish
      version: dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      type: github-action
