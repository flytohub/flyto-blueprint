# gitleaks configuration - FLYA-30 supply-chain baseline.
#
# Posture: inherit the full default rule set (fail closed on real secrets).
# Local triage originally reported 0 findings on both committed history and the
# working tree. Blueprint sharing tests now use one deterministic fake signing
# key, allowed below by exact value rather than by rule or path.
# Keep future exceptions narrow; do not blanket-ignore paths.

title = "flyto-blueprint gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Known fake signing keys used by Blueprint sharing tests"
regexTarget = "match"
regexes = [
  '''ci-signing-key-at-least-16-bytes''',
]
